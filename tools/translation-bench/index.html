<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiểm thử dịch Anh–Việt — Từ Từ</title>
<style>body{font:15px/1.5 system-ui,sans-serif;margin:24px auto;padding:0 16px;max-width:1100px;color:#172b25;background:#f6f8f6}button,select,textarea{font:inherit;padding:10px;border:1px solid #bac8bf;border-radius:8px}button{cursor:pointer;background:white;margin:4px}button:disabled{opacity:.5}textarea{box-sizing:border-box;width:100%;min-height:90px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}article{background:white;border:1px solid #d4dfd6;padding:14px;margin:12px 0;border-radius:10px}iframe{width:100%;height:540px;border:1px solid #ced7cf}#status{font-weight:600}#clock{font-variant-numeric:tabular-nums}</style>
<h1>Kiểm thử dịch Anh–Việt</h1><p>Bản thử riêng, chưa gắn vào giao diện chính. Transformers.js 3.8.1; OPUS-MT q8; WASM, 1 luồng, beam 4.</p>
<p id="environment"></p><p id="status" role="status">Sẵn sàng.</p><p id="clock"></p>
<button id="en">Chạy 12 câu Anh → Việt</button><button id="vi">Chạy 12 câu Việt → Anh</button><button id="repeat">Lặp lại 3 câu</button><button id="offline">Chặn mạng trong bộ dịch và thử cache</button><button id="cancel">Dừng bộ dịch</button><button id="download">Xuất kết quả JSON</button>
<label>Chiều dịch <select id="direction"><option value="en-vi">Anh → Việt</option><option value="vi-en">Việt → Anh</option></select></label><textarea id="input" aria-label="Câu thử">Hello, how are you today?</textarea><button id="single">Dịch câu thử</button><button id="storage">Kiểm tra dung lượng cache</button>
<details><summary>Nhật ký tải và lỗi</summary><pre id="log"></pre></details>
<h2>Kết quả thực tế</h2><div id="results"></div><h2>App chạy cùng bộ dịch</h2><p>Có thể mở từ điển và chuyển màn hình trong khi worker đang dịch.</p><iframe title="Từ Từ — ứng dụng hiện tại" src="/tu-tu/"></iframe>
<script type="module">
import {cases} from './cases.js';
const $=id=>document.getElementById(id);
const report={date:new Date().toISOString(),settings:{library:'@huggingface/transformers@3.8.1',dtype:'q8',device:'wasm',threads:1,beams:4},environment:{userAgent:navigator.userAgent,cores:navigator.hardwareConcurrency,memoryGiB:navigator.deviceMemory,crossOriginIsolated,webgpu:!!navigator.gpu},events:[],results:[]};
$('environment').textContent=JSON.stringify(report.environment);
let worker,running=false,start=0,maxLag=0,last=performance.now(),frames=0;
setInterval(()=>{const now=performance.now();maxLag=Math.max(maxLag,now-last-100);last=now;if(running)$('clock').textContent=`Đã chạy ${((now-start)/1000).toFixed(1)} s; độ trễ luồng giao diện cao nhất ${Math.round(maxLag)} ms`;},100);
function log(e){report.events.push({...e,at:new Date().toISOString()});$('log').textContent=report.events.map(e=>JSON.stringify(e)).join('\n');}
function init(){worker=new Worker('./worker.js',{type:'module'});worker.onmessage=({data:e})=>{log(e);if(e.type==='result'){report.results.push(e.result);const a=document.createElement('article');for(const line of [e.result.id+' · '+Math.round(e.result.ms)+' ms · '+e.result.inputTokens+' tokens',e.result.input,e.result.output]){const p=document.createElement('p');p.textContent=line;a.append(p);}$('results').append(a);$('status').textContent=`Đã dịch ${report.results.length} câu.`;}if(e.type==='loaded')$('status').textContent=`Đã tải ${e.direction} trong ${(e.ms/1000).toFixed(2)} s.`;if(e.type==='progress')$('status').textContent=`${e.progress.status}: ${e.progress.file||e.progress.name||''}`;if(e.type==='complete'||e.type==='error'){running=false;$('status').textContent=e.type==='error'?'Lỗi: '+e.message:'Hoàn tất lượt thử.';report.maxMainThreadLagMs=maxLag;}};worker.onerror=e=>{log({type:'workerError',message:e.message});$('status').textContent='Lỗi worker: '+e.message;running=false;};}
function run(tests){if(running)return;running=true;start=performance.now();maxLag=0;last=start;$('status').textContent='Đang chuẩn bị bộ dịch...';worker.postMessage({type:'run',tests});}
init();$('en').onclick=()=>run(cases.filter(c=>c.direction==='en-vi'));$('vi').onclick=()=>run(cases.filter(c=>c.direction==='vi-en'));
$('repeat').onclick=()=>run(cases.filter(c=>c.direction===$('direction').value).slice(0,3).map(c=>({...c,id:c.id+'-repeat'})));
$('single').onclick=()=>run([{id:'manual-'+report.results.length,direction:$('direction').value,category:'manual',input:$('input').value}]);
$('offline').onclick=()=>{if(running)return;worker.postMessage({type:'offline'});run(cases.filter(c=>c.direction===$('direction').value).slice(0,1).map(c=>({...c,id:c.id+'-offline'})));};
$('cancel').onclick=()=>{worker.terminate();running=false;log({type:'terminated'});$('status').textContent='Đã dừng worker; có thể thử lại.';init();};
$('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.download='translation-bench-results.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$('storage').onclick=async()=>{const estimate=await navigator.storage.estimate();const entries=[];for(const name of await caches.keys())if(name.includes('transformers')){const cache=await caches.open(name);for(const req of await cache.keys()){const response=await cache.match(req);const bytes=(await response.blob()).size;entries.push({url:req.url,bytes});}}log({type:'storage',estimate,entries,totalBytes:entries.reduce((s,e)=>s+e.bytes,0)});$('status').textContent='Đã kiểm tra cache: '+entries.reduce((s,e)=>s+e.bytes,0)+' bytes.';};
</script></html>
